name: Verify MCP package

on:
  push:
    paths:
      - "packages/mcp/**"
      - "verify/typescript/src/**"
      - "verify/test-vectors/**"
      - "examples/witness/**"
      - "integrations/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "packages/mcp/**"
      - "verify/typescript/src/**"
      - "verify/test-vectors/**"
      - "examples/witness/**"
      - "integrations/**"
      - ".github/workflows/mcp.yml"

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - run: npm ci
        working-directory: packages/mcp
      - run: npm run check
        working-directory: packages/mcp
      - name: Test Exa discovery adapter without network
        run: node --test integrations/agent-discovery/discover.test.mjs
      - name: Pack the checked client for the Eliza integration
        run: npm pack --ignore-scripts
        working-directory: packages/mcp
      - name: Install Eliza integration with this client build
        run: npm install --ignore-scripts --package-lock=false ../../packages/mcp/violetclaire-popcorn-mcp-0.1.4.tgz
        working-directory: integrations/eliza
      - name: Check Eliza integration
        run: npm run check
        working-directory: integrations/eliza
      - name: Bundle read-only remote MCP without deploying
        run: npx --yes wrangler@4.138.0 deploy --config remote/wrangler.jsonc --dry-run
        working-directory: packages/mcp
