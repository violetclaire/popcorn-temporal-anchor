name: Verify MCP package

on:
  push:
    paths:
      - "packages/mcp/**"
      - "verify/typescript/src/**"
      - "verify/test-vectors/**"
      - "examples/witness/**"
      - "examples/developer-evidence-v2/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "packages/mcp/**"
      - "verify/typescript/src/**"
      - "verify/test-vectors/**"
      - "examples/witness/**"
      - "examples/developer-evidence-v2/**"
      - ".github/workflows/mcp.yml"

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - run: npm ci
        working-directory: packages/mcp
      - run: npm run check
        working-directory: packages/mcp
      - name: Verify pinned TAIN 2.0 developer sample
        run: node --import tsx ../../examples/developer-evidence-v2/check-sample.mjs
        working-directory: packages/mcp
      - name: Bundle read-only remote MCP without deploying
        run: npx --yes wrangler@4.138.0 deploy --config remote/wrangler.jsonc --dry-run
        working-directory: packages/mcp
