name: Verify interoperability kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            verify/typescript/package-lock.json
            examples/typescript-x402-client/package-lock.json
      - run: npm ci
        working-directory: verify/typescript
      - run: npm run check
        working-directory: verify/typescript
      - run: npm ci
        working-directory: examples/typescript-x402-client
      - run: npm run check
        working-directory: examples/typescript-x402-client

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verify/python/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: verify/python
      - run: python -m unittest -v test_popcorn_verify.py
        working-directory: verify/python
