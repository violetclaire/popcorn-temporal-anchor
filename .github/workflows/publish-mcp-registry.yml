name: Publish MCP discovery listing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/publish-mcp-registry.yml"
      - "packages/mcp/registry/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-mcp-registry.yml"
      - "packages/mcp/registry/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the advertised package is already public
        run: node packages/mcp/registry/check-published.mjs

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'violetclaire/popcorn-temporal-anchor'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned official publisher
        shell: bash
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  %s\n' 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' "$RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Authenticate the GitHub-owned namespace
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish the available version
        working-directory: packages/mcp/registry
        run: '"$RUNNER_TEMP/mcp-publisher" publish'
