name: Verify Eliza integration

on:
  push:
    paths:
      - "integrations/eliza/**"
      - ".github/workflows/eliza.yml"
  pull_request:
    paths:
      - "integrations/eliza/**"
      - ".github/workflows/eliza.yml"

permissions:
  contents: read

jobs:
  eliza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - run: npm ci
        working-directory: packages/mcp
      - run: npm run build
        working-directory: packages/mcp
      - name: Pack the client for the Eliza integration
        run: npm pack --ignore-scripts
        working-directory: packages/mcp
      - name: Install Eliza integration with this client build
        run: npm install --ignore-scripts --package-lock=false ../../packages/mcp/violetclaire-popcorn-mcp-0.1.4.tgz
        working-directory: integrations/eliza
      - name: Check Eliza integration
        run: npm run check
        working-directory: integrations/eliza
